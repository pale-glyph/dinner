services:
  postgres:
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      dinner:
        aliases:
          - dinner-db

  agent-gateway:
    build:
      context: .
      dockerfile: src/services/Dinner.AgentGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # `postgres` is ambiguous once this service also joins the Agent Platform
      # network, which has its own PostgreSQL service.
      ConnectionStrings__Dinner: Host=dinner-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      AgentPlatform__BaseUrl: ${AGENT_PLATFORM_BASE_URL:-}
      AgentPlatform__ProjectId: ${AGENT_PLATFORM_PROJECT_ID:-}
      AgentPlatform__AgentId: ${AGENT_PLATFORM_AGENT_ID:-}
      AgentPlatform__WebhookSecret: ${AGENT_PLATFORM_WEBHOOK_SECRET:-}
    ports:
      - "${AGENT_GATEWAY_PORT:-18081}:8080"
    healthcheck: &service_healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dinner
      - agent-platform
    depends_on:
      postgres:
        condition: service_healthy

  household-service:
    build:
      context: .
      dockerfile: src/services/Dinner.HouseholdService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Dinner: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Dinner__InternalApiKey: ${DINNER_INTERNAL_API_KEY}
    ports:
      - "${HOUSEHOLD_SERVICE_PORT:-18082}:8080"
    healthcheck: *service_healthcheck
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dinner

  pantry-service:
    build:
      context: .
      dockerfile: src/services/Dinner.PantryService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Dinner: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${PANTRY_SERVICE_PORT:-18083}:8080"
    healthcheck: *service_healthcheck
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dinner
      - agent-platform

  recipe-service:
    build:
      context: .
      dockerfile: src/services/Dinner.RecipeService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Dinner: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${RECIPE_SERVICE_PORT:-18084}:8080"
    healthcheck: *service_healthcheck
    networks:
      - dinner
      - agent-platform

  nutrition-data-service:
    build:
      context: .
      dockerfile: src/services/Dinner.NutritionDataService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Dinner: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${NUTRITION_DATA_SERVICE_PORT:-18085}:8080"
    healthcheck: *service_healthcheck
    networks:
      - dinner
      - agent-platform

  meal-planning-service:
    build:
      context: .
      dockerfile: src/services/Dinner.MealPlanningService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Dinner: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "${MEAL_PLANNING_SERVICE_PORT:-18086}:8080"
    healthcheck: *service_healthcheck
    networks:
      - dinner
      - agent-platform

  shopping-list-service:
    build:
      context: .
      dockerfile: src/services/Dinner.ShoppingListService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    ports:
      - "${SHOPPING_LIST_SERVICE_PORT:-18087}:8080"
    healthcheck: *service_healthcheck
    networks:
      - dinner
      - agent-platform

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_PANTRY_API_URL: http://localhost:${PANTRY_SERVICE_PORT:-18083}
      NEXT_PUBLIC_RECIPE_API_URL: http://localhost:${RECIPE_SERVICE_PORT:-18084}
      NEXT_PUBLIC_AGENT_GATEWAY_API_URL: http://localhost:${AGENT_GATEWAY_PORT:-18081}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      DINNER_INTERNAL_API_KEY: ${DINNER_INTERNAL_API_KEY}
      HOUSEHOLD_SERVICE_URL: http://household-service:8080
    ports:
      - "${DINNER_WEB_PORT:-3011}:3000"
    depends_on:
      agent-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dinner

volumes:
  postgres_data:

networks:
  dinner:
    internal: false
  # Shared with the separately deployed Agent Platform. The gateway needs this
  # network to resolve the platform's `api` service hostname.
  agent-platform:
    external: true
    name: ${AGENT_PLATFORM_NETWORK:-agent-platform-mcp}
